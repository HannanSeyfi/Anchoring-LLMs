# Pilot study configuration.
# See docs/pilot_protocol.md for the design and docs/model_choice.md for the models.

name: pilot
output_dir: data/pilot          # smoke tests write to data/pilot_smoke instead

items:
  study1: data/items/study1_provided.csv
  study2: data/items/study2_self_anchor.csv

# Models are loaded one at a time with vLLM. Pick one per Colab run.
models:
  qwen3-8b:
    hf_id: Qwen/Qwen3-8B
    dtype: bfloat16
    note: Hybrid model; thinking can be switched off at the same weights.
  r1-distill-llama-8b:
    hf_id: deepseek-ai/DeepSeek-R1-Distill-Llama-8B
    dtype: bfloat16
    note: Llama-based reasoning model distilled from DeepSeek-R1; a second model family.
  # Fallbacks for a free Colab T4 GPU (16 GB, no bfloat16).
  qwen3-4b:
    hf_id: Qwen/Qwen3-4B
    dtype: float16
    note: T4 fallback for qwen3-8b.
  r1-distill-qwen-1.5b:
    hf_id: deepseek-ai/DeepSeek-R1-Distill-Qwen-1.5B
    dtype: float16
    note: T4 fallback for r1-distill-llama-8b (smaller, different base model).

# Reasoning levels = maximum thinking tokens. 0 means thinking is switched off.
# Budgets are enforced by the runner (budget forcing), and realised tokens are logged.
# Keep the quotes: unquoted `off` is read by YAML as the boolean false.
thinking_levels:
  "off": 0
  "low": 512
  "high": 2048

sampling:
  temperature: 0.7
  top_p: 0.95
  answer_max_tokens: 512
  seed: 20261024

baseline:
  samples_per_level: 20        # unanchored answers per item and reasoning level

study1:
  samples: 10                  # samples per anchored cell
  directions: [low, high]
  distances:                   # offset beyond the plausible range, in range widths (log10 scale)
    near: 0.25
    far: 1.0
  precisions: [round, precise]
  range_quantiles: [0.05, 0.95]
  min_log_width: 0.15          # floor on the plausible-range width (log10 units)

study2:
  samples: 10
  sources: [self, provided]
  instructions: [none, accuracy, opposite]

engine:
  max_model_len: 8192
  gpu_memory_utilization: 0.90
  cells_per_batch: 48          # results are saved after every batch

sync:
  min_interval_seconds: 600    # push to GitHub at most every 10 minutes during a run
