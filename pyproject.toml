[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anchoring-llms"
version = "0.1.0"
description = "Experiments on the mechanisms of anchoring in large language models"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pandas",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
gpu = ["vllm"]
api = ["requests", "transformers"]   # hosted models (DeepInfra); transformers only loads the tokenizer
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
